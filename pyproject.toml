[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognizer"
version = "0.1.0"
description = "Face recognition access control pipeline: YOLO detection → liveness → DFA alignment → ArcFace embedding → SQLite + FAISS matching."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "ultralytics>=8.0.0",
    "faiss-cpu>=1.7.4",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "scikit-image>=0.20.0",
    "transformers>=4.30.0",
    "huggingface_hub>=0.20.0",
    "timm>=0.9.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "numpy>=1.26.4",
    "tqdm",
    "pyyaml",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/khenm/face-recognizer"
Documentation = "https://github.com/khenm/face-recognizer/blob/main/docs/api.md"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
face-recognizer-serve = "scripts.serve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["face_recognizer*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
